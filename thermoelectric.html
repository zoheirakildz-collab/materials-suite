<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermoelectric Analytics | Optik Style</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --panel-bg: #111827;
            --panel-border: #1f2937;
            --accent-glow: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #030712;
            --notice-color: #f59e0b;
            --btn-success: #10b981;
            --btn-success-hover: #059669;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .brand-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
            background: var(--accent-glow);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        .unit-notice {
            font-size: 0.75rem;
            color: var(--notice-color);
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.5rem 0.65rem;
            border-radius: 8px;
            font-size: 0.85rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent-glow);
        }

        /* Range controls grid */
        .range-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        .range-grid input {
            text-align: center;
        }

        .temp-add-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .btn-add {
            background-color: var(--accent-glow);
            color: white;
            border: none;
            padding: 0 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .temp-tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .temp-tag {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .temp-tag span {
            cursor: pointer;
            color: #f87171;
            font-weight: bold;
        }

        .columns-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 0.5rem;
            max-height: 180px;
            overflow-y: auto;
            background: var(--input-bg);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .col-box {
            display: flex;
            flex-direction: column;
        }

        .col-box label {
            font-size: 0.7rem;
            text-align: center;
            color: var(--accent-glow);
            font-weight: bold;
        }

        .col-box textarea {
            height: 100px;
            font-family: monospace;
            font-size: 0.75rem;
            resize: none;
            padding: 0.3rem;
        }

        .btn-plot {
            width: 100%;
            background-color: var(--accent-glow);
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.2s;
        }

        .btn-plot:hover {
            background-color: var(--accent-hover);
        }

        .main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .viewport-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .viewport-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .btn-download {
            background-color: var(--btn-success);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: var(--btn-success-hover);
        }

        .chart-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="sidebar">
            <div class="brand-header">
                <h2>ZA Workbench</h2>
                <a href="index.html" class="back-link">← Back</a>
            </div>

            <!-- Property Selection -->
            <div class="form-group">
                <div class="section-title">1. Select Metric</div>
                <select id="propertySelect" onchange="updateView()">
                    <option value="seebeck">Seebeck Coefficient (S)</option>
                    <option value="electrical">Electrical Conductivity (σ/τ)</option>
                    <option value="thermal">Thermal Conductivity (κ/τ)</option>
                    <option value="powerFactor">Power Factor (PF)</option>
                    <option value="zt">Figure of Merit (ZT)</option>
                </select>
            </div>

            <!-- Custom Temperature Selection -->
            <div class="form-group">
                <div class="section-title">2. Target Temperatures (K)</div>
                <div class="temp-add-box">
                    <input type="number" id="tempInput" placeholder="e.g. 450">
                    <button class="btn-add" onclick="addTemperature()">Add</button>
                </div>
                <div class="temp-tags-list" id="tempTags"></div>
            </div>

            <!-- X-Axis Definition & Range Controls -->
            <div class="form-group">
                <div class="section-title">3. X-Axis Range & Interval</div>
                <div class="range-grid">
                    <div>
                        <label>X Min</label>
                        <input type="number" id="xMin" value="-0.5" step="0.1" onchange="renderChart()">
                    </div>
                    <div>
                        <label>X Max</label>
                        <input type="number" id="xMax" value="0.5" step="0.1" onchange="renderChart()">
                    </div>
                    <div>
                        <label>Step Size</label>
                        <input type="number" id="xStep" value="0.2" step="0.05" onchange="renderChart()">
                    </div>
                </div>
            </div>

            <!-- Dynamic Input Columns -->
            <div class="form-group">
                <div class="section-title">4. Data Columns Input</div>
                <div id="noticeContainer"></div>
                <div class="columns-wrapper" id="columnsContainer"></div>
            </div>

            <button class="btn-plot" onclick="renderChart()">⚡ Plot Spectrum</button>
        </div>

        <div class="main-viewport">
            <div class="viewport-header">
                <div class="viewport-title" id="graphTitle">Seebeck Coefficient (S) Spectrum</div>
                <button class="btn-download" onclick="downloadPlot()">📷 Download Plot (PNG)</button>
            </div>

            <div class="chart-container">
                <canvas id="optikChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        let chartInstance = null;
        let activeTemps = [300, 600, 900];

        const propertyUnits = {
            seebeck: { name: 'Seebeck Coefficient', unit: 'μV/K', convertFactor: 1e6 },
            electrical: { name: 'Electrical Conductivity', unit: '1/Ω·m·s', convertFactor: 1 },
            thermal: { name: 'Thermal Conductivity', unit: 'W/m·K·s', convertFactor: 1 },
            powerFactor: { name: 'Power Factor', unit: 'W/m·K²·s', convertFactor: 1 },
            zt: { name: 'Figure of Merit (ZT)', unit: 'Dimensionless', convertFactor: 1 }
        };

        const colorsList = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];

        // Plugin to set dark background when exporting canvas as image
        const darkBackgroundPlugin = {
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart) => {
                const {ctx} = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#111827';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        function renderTempTags() {
            const container = document.getElementById('tempTags');
            container.innerHTML = '';
            activeTemps.forEach((temp, index) => {
                const tag = document.createElement('div');
                tag.className = 'temp-tag';
                tag.innerHTML = `${temp} K <span onclick="removeTemperature(${index})">&times;</span>`;
                container.appendChild(tag);
            });
            buildDataColumns();
        }

        function addTemperature() {
            const val = parseInt(document.getElementById('tempInput').value);
            if (val && !activeTemps.includes(val)) {
                activeTemps.push(val);
                activeTemps.sort((a, b) => a - b);
                document.getElementById('tempInput').value = '';
                renderTempTags();
                renderChart();
            }
        }

        function removeTemperature(index) {
            activeTemps.splice(index, 1);
            renderTempTags();
            renderChart();
        }

        function buildDataColumns() {
            const container = document.getElementById('columnsContainer');
            const propKey = document.getElementById('propertySelect').value;
            container.innerHTML = '';

            const noticeContainer = document.getElementById('noticeContainer');
            if (propKey === 'seebeck') {
                noticeContainer.innerHTML = `<div class="unit-notice">ℹ️ Input in <b>V/K</b> (Auto-converted to μV/K)</div>`;
            } else {
                noticeContainer.innerHTML = '';
            }

            // X Column
            const xBox = document.createElement('div');
            xBox.className = 'col-box';
            xBox.innerHTML = `
                <label>X Axis</label>
                <textarea id="col_X" placeholder="X values">-0.5\n-0.3\n-0.1\n0.1\n0.3\n0.5</textarea>
            `;
            container.appendChild(xBox);

            // Columns for Temperatures
            activeTemps.forEach(T => {
                const box = document.createElement('div');
                box.className = 'col-box';
                let sampleVal = propKey === 'seebeck' ? "0.00005\n0.00012\n0.0\n-0.00012\n-0.00005\n0.0" : "10\n20\n0\n-20\n-10\n0";
                box.innerHTML = `
                    <label>${T} K</label>
                    <textarea id="col_${T}" placeholder="Y values">${sampleVal}</textarea>
                `;
                container.appendChild(box);
            });
        }

        function updateView() {
            const propKey = document.getElementById('propertySelect').value;
            document.getElementById('graphTitle').innerText = `${propertyUnits[propKey].name} Spectrum`;
            buildDataColumns();
            renderChart();
        }

        function renderChart() {
            const propKey = document.getElementById('propertySelect').value;
            const factor = propertyUnits[propKey].convertFactor;

            const xText = document.getElementById('col_X') ? document.getElementById('col_X').value.trim() : "";
            const xRaw = xText.split('\n').filter(v => v !== '').map(Number);

            const xMin = parseFloat(document.getElementById('xMin').value);
            const xMax = parseFloat(document.getElementById('xMax').value);
            const xStep = parseFloat(document.getElementById('xStep').value);

            let datasets = [];

            activeTemps.forEach((T, i) => {
                const textarea = document.getElementById(`col_${T}`);
                if (textarea) {
                    const yRaw = textarea.value.trim().split('\n')
                                      .filter(v => v !== '')
                                      .map(v => Number(v) * factor);

                    let dataPoints = xRaw.map((x, idx) => ({ x: x, y: yRaw[idx] }));

                    datasets.push({
                        label: `${T} K`,
                        data: dataPoints,
                        borderColor: colorsList[i % colorsList.length],
                        backgroundColor: colorsList[i % colorsList.length],
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        tension: 0.35
                    });
                }
            });

            const ctx = document.getElementById('optikChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets: datasets },
                plugins: [darkBackgroundPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#9ca3af' } }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: xMin,
                            max: xMax,
                            ticks: {
                                stepSize: xStep,
                                color: '#9ca3af'
                            },
                            title: { display: true, color: '#9ca3af', text: 'Chemical Potential μ - E_f (eV)' },
                            grid: { color: '#1f2937' }
                        },
                        y: {
                            title: { display: true, color: '#9ca3af', text: `${propertyUnits[propKey].name} (${propertyUnits[propKey].unit})` },
                            grid: { color: '#1f2937' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });
        }

        function downloadPlot() {
            if (!chartInstance) return;
            const link = document.createElement('a');
            const propKey = document.getElementById('propertySelect').value;
            link.download = `${propKey}_spectrum.png`;
            link.href = chartInstance.toBase64Image('image/png', 1.0);
            link.click();
        }

        window.onload = function() {
            renderTempTags();
            renderChart();
        };
    </script>
</body>
</html>
